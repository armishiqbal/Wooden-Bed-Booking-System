<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Wooden Bed Booking System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }
        .navbar-custom {
            background-color: #212529;
            padding: 12px 20px;
        }
        .navbar-brand {
            font-weight: 700;
            color: #ffffff !important;
            font-size: 20px;
        }
        .nav-link {
            color: #cfd4da !important;
            font-size: 15px;
            margin-right: 15px;
        }
        .nav-link:hover {
            color: #ffffff !important;
        }
        footer {
            background-color: #212529;
            color: #999;
            padding: 25px 0;
            text-align: center;
            font-size: 14px;
            margin-top: 50px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">🛏️ Wooden Bed Booking</a>
            <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'add_booking' %}">Add Booking</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'api_bookings_list' %}">REST API</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/" target="_blank">Admin Panel</a></li>
                </ul>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <footer>
        <div class="container">
            <p class="mb-1"><strong>Wooden Bed Booking System</strong> — Developed using Django & Django REST Framework</p>
            <p class="mb-0">Created by <strong>Armish Iqbal</strong> | Islamia University Bahawalpur</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
